spring.application.name=agent-service
server.port=8087

# Eureka (annuaire)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ============ Q9 : LLM local Ollama ============
# Prerequis : ollama installe + "ollama pull qwen2.5:7b"
# Le modele DOIT supporter le "tool calling" (qwen2.5, qwen3, llama3.1, mistral-nemo...)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.temperature=0.2

# ============ Q9 : client MCP ============
# Une connexion par micro-service (serveur MCP). L'endpoint par defaut est /mcp
spring.ai.mcp.client.name=ecom-agent
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.inventory-service.url=http://localhost:8082
spring.ai.mcp.client.streamable-http.connections.billing-service.url=http://localhost:8083

# ============ Q10 : bots ============
# Les bots ne demarrent QUE si leur token est defini.
# Le plus simple : definir les variables d'environnement TELEGRAM_BOT_TOKEN et DISCORD_BOT_TOKEN
# (dans IntelliJ : Run > Edit Configurations > Environment variables).
# Ne jamais commiter un vrai token sur GitHub !
#telegram.bot.token et discord.bot.token ont été placés dans les variables d'environnement

logging.level.org.springframework.ai=INFO
